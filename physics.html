/* ============================================================
   CLICK / TAP AIM
============================================================ */

const raycaster =
    new THREE.Raycaster();

const pointerNDC =
    new THREE.Vector2();


function aimFromPointer(
    clientX,
    clientY
) {

    const rect =
        renderer.domElement
        .getBoundingClientRect();


    pointerNDC.x =

        (
            (
                clientX -
                rect.left
            )

            /

            rect.width
        )

        *

        2

        -

        1;


    pointerNDC.y =

        -(

            (
                clientY -
                rect.top
            )

            /

            rect.height

        )

        *

        2

        +

        1;


    raycaster.setFromCamera(

        pointerNDC,

        camera

    );


    const hits =
        raycaster.intersectObject(

            wall,

            false

        );


    if (
        hits.length ===
        0
    ) {
        return;
    }


    const hit =
        hits[0];


    if (
        hit.instanceId !==
        undefined
    ) {

        const index =
            hit.instanceId;


        const p =
            index * 3;


        aimPoint.set(

            positions[p],

            positions[p + 1],

            positions[p + 2]

        );

    }

    else {

        aimPoint.copy(
            hit.point
        );

    }


    aimMarker.position.copy(
        hit.point
    );


    aimMarker.visible =
        true;

}


/* ============================================================
   360° CAMERA CONTROLLER
============================================================ */

const activePointers =
    new Map();


let cameraGesture =
    false;

let pointerMoved =
    false;

let pinchMode =
    false;


let pointerStartX =
    0;

let pointerStartY =
    0;

let lastPointerX =
    0;

let lastPointerY =
    0;

let lastPinchDistance =
    0;


const MOUSE_ROTATE_SPEED =
    0.005;

const TOUCH_ROTATE_SPEED =
    0.006;

const PINCH_ZOOM_SPEED =
    0.025;


/* ============================================================
   PINCH
============================================================ */

function getPinchDistance() {

    if (
        activePointers.size <
        2
    ) {
        return 0;
    }


    const iterator =
        activePointers.values();


    const a =
        iterator.next().value;


    const b =
        iterator.next().value;


    return Math.hypot(

        b.x -
        a.x,

        b.y -
        a.y

    );

}


/* ============================================================
   POINTER DOWN
============================================================ */

renderer.domElement.addEventListener(

    "pointerdown",

    event => {

        event.preventDefault();


        activePointers.set(

            event.pointerId,

            {
                x:
                    event.clientX,

                y:
                    event.clientY
            }

        );


        try {

            renderer.domElement
                .setPointerCapture(
                    event.pointerId
                );

        }
        catch {}


        if (
            activePointers.size ===
            1
        ) {

            cameraGesture =
                true;

            pointerMoved =
                false;

            pinchMode =
                false;


            pointerStartX =
                event.clientX;

            pointerStartY =
                event.clientY;


            lastPointerX =
                event.clientX;

            lastPointerY =
                event.clientY;

        }


        else if (
            activePointers.size ===
            2
        ) {

            pinchMode =
                true;

            pointerMoved =
                true;

            cameraGesture =
                false;


            lastPinchDistance =
                getPinchDistance();

        }

    },

    {
        passive:
            false
    }

);


/* ============================================================
   POINTER MOVE
============================================================ */

renderer.domElement.addEventListener(

    "pointermove",

    event => {

        if (
            !activePointers.has(
                event.pointerId
            )
        ) {
            return;
        }


        event.preventDefault();


        activePointers.set(

            event.pointerId,

            {
                x:
                    event.clientX,

                y:
                    event.clientY
            }

        );


        /*
            PINCH ZOOM
        */

        if (
            activePointers.size >=
            2
        ) {

            pinchMode =
                true;

            pointerMoved =
                true;


            const currentDistance =
                getPinchDistance();


            if (
                lastPinchDistance >
                0
            ) {

                const difference =

                    currentDistance

                    -

                    lastPinchDistance;


                targetDistance -=

                    difference *
                    PINCH_ZOOM_SPEED;


                targetDistance =
                    THREE.MathUtils.clamp(

                        targetDistance,

                        MIN_CAMERA_DISTANCE,

                        MAX_CAMERA_DISTANCE

                    );

            }


            lastPinchDistance =
                currentDistance;


            return;

        }


        /*
            ONE POINTER ROTATE
        */

        if (
            !cameraGesture
        ) {
            return;
        }


        const totalMovement =
            Math.hypot(

                event.clientX -
                pointerStartX,

                event.clientY -
                pointerStartY

            );


        if (
            totalMovement >
            4
        ) {

            pointerMoved =
                true;

        }


        if (
            !pointerMoved
        ) {
            return;
        }


        const dx =

            event.clientX -
            lastPointerX;


        const dy =

            event.clientY -
            lastPointerY;


        const speed =

            event.pointerType ===
            "touch"

                ? TOUCH_ROTATE_SPEED

                : MOUSE_ROTATE_SPEED;


        /*
            Horizontal:
            unlimited 360°.
        */

        targetYaw -=

            dx *
            speed;


        /*
            Keep values numerically small without
            limiting rotation.
        */

        if (
            targetYaw >
            Math.PI * 4
        ) {

            targetYaw -=
                Math.PI * 2;

            cameraYaw -=
                Math.PI * 2;

        }

        else if (
            targetYaw <
            -Math.PI * 4
        ) {

            targetYaw +=
                Math.PI * 2;

            cameraYaw +=
                Math.PI * 2;

        }


        /*
            Vertical orbit.
        */

        targetPitch +=

            dy *
            speed;


        targetPitch =
            THREE.MathUtils.clamp(

                targetPitch,

                -MAX_CAMERA_PITCH,

                MAX_CAMERA_PITCH

            );


        lastPointerX =
            event.clientX;

        lastPointerY =
            event.clientY;

    },

    {
        passive:
            false
    }

);


/* ============================================================
   POINTER END
============================================================ */

function finishPointer(
    event
) {

    const wasSingle =
        activePointers.size ===
        1;


    const shouldAim =

        wasSingle &&

        !pointerMoved &&

        !pinchMode;


    activePointers.delete(
        event.pointerId
    );


    if (
        shouldAim
    ) {

        aimFromPointer(

            event.clientX,

            event.clientY

        );

    }


    if (
        activePointers.size ===
        0
    ) {

        cameraGesture =
            false;

        pointerMoved =
            false;

        pinchMode =
            false;

        lastPinchDistance =
            0;

    }


    else if (
        activePointers.size ===
        1
    ) {

        const remaining =

            activePointers
                .values()
                .next()
                .value;


        pointerStartX =
            remaining.x;

        pointerStartY =
            remaining.y;


        lastPointerX =
            remaining.x;

        lastPointerY =
            remaining.y;


        pointerMoved =
            true;

        pinchMode =
            false;

        cameraGesture =
            true;

    }

}


renderer.domElement.addEventListener(
    "pointerup",
    finishPointer
);


renderer.domElement.addEventListener(
    "pointercancel",
    finishPointer
);


/* ============================================================
   MOUSE WHEEL ZOOM
============================================================ */

renderer.domElement.addEventListener(

    "wheel",

    event => {

        event.preventDefault();


        const zoomFactor =

            Math.exp(

                event.deltaY *
                0.001

            );


        targetDistance *=
            zoomFactor;


        targetDistance =
            THREE.MathUtils.clamp(

                targetDistance,

                MIN_CAMERA_DISTANCE,

                MAX_CAMERA_DISTANCE

            );

    },

    {
        passive:
            false
    }

);


/* ============================================================
   BUTTONS
============================================================ */

launchButton.addEventListener(
    "click",
    requestLaunch
);


resetButton.addEventListener(
    "click",
    resetWall
);


resetCameraButton.addEventListener(
    "click",
    resetCamera
);


/* ============================================================
   RECORDING
============================================================ */

let mediaRecorder =
    null;

let recordingChunks =
    [];

let recordingStream =
    null;

let recordingStartedAt =
    0;

let timerInterval =
    null;

let screenWakeLock =
    null;


/* ============================================================
   RECORD FORMAT
============================================================ */

function getSupportedRecordingType() {

    if (
        typeof MediaRecorder ===
        "undefined"
    ) {
        return "";
    }


    const types = [

        "video/mp4;codecs=avc1.42E01E",

        "video/mp4",

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm"

    ];


    for (
        const type of types
    ) {

        if (
            MediaRecorder
                .isTypeSupported(
                    type
                )
        ) {

            return type;

        }

    }


    return "";

}


/* ============================================================
   RECORD TIMER
============================================================ */

function updateRecordTimer() {

    const totalSeconds =

        Math.floor(

            (
                performance.now() -
                recordingStartedAt
            )

            /

            1000

        );


    const minutes =
        Math.floor(
            totalSeconds /
            60
        );


    const seconds =
        totalSeconds %
        60;


    recordTimer.textContent =

        String(
            minutes
        )
        .padStart(
            2,
            "0"
        )

        +

        ":"

        +

        String(
            seconds
        )
        .padStart(
            2,
            "0"
        );

}


/* ============================================================
   START RECORD
============================================================ */

async function startRecording() {

    if (
        isRecording
    ) {
        return;
    }


    const canvas =
        renderer.domElement;


    if (
        typeof canvas.captureStream !==
        "function" ||

        typeof MediaRecorder ===
        "undefined"
    ) {

        alert(
            "Video recording is not supported by this browser."
        );

        return;

    }


    isRecording =
        true;


    /*
        Actual recording buffer:
        1080 × 1920.
    */

    renderer.setPixelRatio(
        1
    );


    renderer.setSize(

        RECORD_WIDTH,

        RECORD_HEIGHT,

        false

    );


    renderer.render(
        scene,
        camera
    );


    recordingStream =
        canvas.captureStream(
            RECORD_FPS
        );


    const mimeType =
        getSupportedRecordingType();


    const options = {

        videoBitsPerSecond:
            RECORD_BITRATE

    };


    if (
        mimeType
    ) {

        options.mimeType =
            mimeType;

    }


    try {

        mediaRecorder =
            new MediaRecorder(

                recordingStream,

                options

            );

    }

    catch (
        error
    ) {

        console.error(
            error
        );


        isRecording =
            false;


        resizeRenderer();


        alert(
            "Could not start the recorder."
        );


        return;

    }


    recordingChunks =
        [];


    mediaRecorder.ondataavailable =
        event => {

            if (
                event.data &&
                event.data.size >
                0
            ) {

                recordingChunks.push(
                    event.data
                );

            }

        };


    mediaRecorder.onstop =
        saveRecording;


    try {

        if (
            "wakeLock" in navigator
        ) {

            screenWakeLock =

                await navigator
                    .wakeLock
                    .request(
                        "screen"
                    );

        }

    }

    catch {}


    mediaRecorder.start(
        1000
    );


    recordingStartedAt =
        performance.now();


    recordButton
        .classList
        .add(
            "recording"
        );


    recordText.textContent =
        "STOP & SAVE";


    updateRecordTimer();


    timerInterval =
        setInterval(

            updateRecordTimer,

            500

        );

}


/* ============================================================
   STOP RECORD
============================================================ */

function stopRecording() {

    if (
        !isRecording
    ) {
        return;
    }


    if (
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ) {

        mediaRecorder.stop();

    }


    clearInterval(
        timerInterval
    );


    recordButton
        .classList
        .remove(
            "recording"
        );


    recordText.textContent =
        "START RECORD";

}


/* ============================================================
   SAVE
============================================================ */

async function saveRecording() {

    const mimeType =

        mediaRecorder?.mimeType

        ||

        getSupportedRecordingType()

        ||

        "video/webm";


    const extension =

        mimeType.includes(
            "mp4"
        )

            ? "mp4"

            : "webm";


    const blob =
        new Blob(

            recordingChunks,

            {
                type:
                    mimeType
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =

        "real-speed-destruction-"

        +

        Date.now()

        +

        "."

        +

        extension;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(

        () => {

            URL.revokeObjectURL(
                url
            );

        },

        5000

    );


    if (
        recordingStream
    ) {

        recordingStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }


    recordingStream =
        null;


    recordingChunks =
        [];


    if (
        screenWakeLock
    ) {

        try {

            await screenWakeLock.release();

        }

        catch {}


        screenWakeLock =
            null;

    }


    isRecording =
        false;


    recordTimer.textContent =
        "00:00";


    resizeRenderer();

}


/* ============================================================
   RECORD BUTTON
============================================================ */

recordButton.addEventListener(

    "click",

    () => {

        if (
            isRecording
        ) {

            stopRecording();

        }

        else {

            startRecording();

        }

    }

);


/* ============================================================
   KEYBOARD
============================================================ */

window.addEventListener(

    "keydown",

    event => {

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            requestLaunch();

        }


        else if (
            event.code ===
            "KeyR"
        ) {

            resetWall();

        }


        else if (
            event.code ===
            "KeyC"
        ) {

            resetCamera();

        }

    }

);


/* ============================================================
   RESIZE
============================================================ */

const resizeObserver =
    new ResizeObserver(
        resizeRenderer
    );


resizeObserver.observe(
    animationFrame
);


window.addEventListener(
    "resize",
    resizeRenderer
);


/* ============================================================
   FPS
============================================================ */

let fpsFrames =
    0;

let previousFPSTime =
    performance.now();


function updateFPS(
    now
) {

    fpsFrames++;


    const elapsed =
        now -
        previousFPSTime;


    if (
        elapsed >=
        600
    ) {

        fpsElement.textContent =

            Math.round(

                fpsFrames *
                1000 /
                elapsed

            );


        dynamicCountElement.textContent =
            activeCount;


        fpsFrames =
            0;


        previousFPSTime =
            now;

    }

}


/* ============================================================
   MAIN LOOP
============================================================ */

let previousTime =
    performance.now();

let accumulator =
    0;

let previousRecordedRender =
    0;


function animate(
    now
) {

    const delta =

        Math.min(

            (
                now -
                previousTime
            )

            /

            1000,

            0.035

        );


    previousTime =
        now;


    accumulator +=
        delta;


    /*
        Fixed physics.
    */

    let substeps =
        0;


    while (
        accumulator >=
        FIXED_STEP &&

        substeps <
        2
    ) {

        physicsStep(
            FIXED_STEP
        );


        accumulator -=
            FIXED_STEP;


        substeps++;

    }


    if (
        accumulator >
        FIXED_STEP *
        2
    ) {

        accumulator =
            0;

    }


    syncInstanceMatrices();


    /*
        Launch countdown.
    */

    updateLaunchSequence(
        now
    );


    /*
        3D speed text.
    */

    updateSpeedText(
        now
    );


    /*
        Smooth 360 camera.
    */

    cameraYaw +=

        (
            targetYaw -
            cameraYaw
        )

        *
        0.16;


    cameraPitch +=

        (
            targetPitch -
            cameraPitch
        )

        *
        0.16;


    cameraDistance +=

        (
            targetDistance -
            cameraDistance
        )

        *
        0.14;


    updateCamera();


    /*
        Speed text must billboard after camera update.
    */

    if (
        speedTextMesh.visible
    ) {

        speedTextMesh.lookAt(
            camera.position
        );

    }


    updateFPS(
        now
    );


    /*
        1080×1920 recording at ~30 FPS,
        while physics stays at 60 Hz.
    */

    if (
        isRecording
    ) {

        if (
            now -
            previousRecordedRender

            <

            1000 /
            RECORD_FPS
        ) {

            return;

        }


        previousRecordedRender =
            now;

    }


    renderer.render(
        scene,
        camera
    );

}


/* ============================================================
   START
============================================================ */

renderer.setAnimationLoop(
    animate
);


setTimeout(

    () => {

        loadingElement
            .classList
            .add(
                "hide"
            );

    },

    300

);

</script>
